<!-- @dsCard group="设计交付" viewport="1440x900" name="01 · 管理后台原型" subtitle="十模块 + 公共件全套 · ConfirmDialog / Toast / 拖拽排序 / 图表悬停" -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"></meta>
<meta name="viewport" content="width=device-width, initial-scale=1"></meta>
<title>Lumio Admin · 运营后台高保真原型</title>
<link rel="stylesheet" href="admin-base.css"></link>
<link rel="stylesheet" href="admin-components.css"></link>
</head>
<body>
<div class="ad-root" id="ad-root">

  <!-- 侧栏（深色 = 后台身份签名） -->
  <aside class="ad-side" id="ad-side" data-screen-label="Admin 侧栏">
    <div class="ad-brand">
      <div class="ad-logo">L</div>
      <div><div class="ad-brand-name">Lumio Admin</div><div class="ad-brand-sub">img.lumio.games 运营后台</div></div>
    </div>
    <nav class="ad-nav" id="ad-nav">
      <div class="ad-nav-group">
        <button type="button" class="ad-nav-item active" data-view="overview">总览</button>
      </div>
      <div class="ad-nav-group">
        <div class="ad-nav-label">内容运营</div>
        <button type="button" class="ad-nav-item" data-view="materials">素材库</button>
        <button type="button" class="ad-nav-item" data-view="shares">分享管理<span class="ad-badge" data-badge="shares">3</span></button>
        <button type="button" class="ad-nav-item" data-view="safety">内容安全<span class="ad-badge" data-badge="safety">5</span></button>
        <button type="button" class="ad-nav-item" data-view="announcements">公告运营</button>
      </div>
      <div class="ad-nav-group">
        <div class="ad-nav-label">用户与增长</div>
        <button type="button" class="ad-nav-item" data-view="users">用户记录</button>
        <button type="button" class="ad-nav-item" data-view="invites">邀请裂变</button>
      </div>
      <div class="ad-nav-group">
        <div class="ad-nav-label">监控与治理</div>
        <button type="button" class="ad-nav-item" data-view="errors">报错监控<span class="ad-badge" data-badge="errors">12</span></button>
        <button type="button" class="ad-nav-item" data-view="cost">成本看板</button>
        <button type="button" class="ad-nav-item" data-view="audit">审计日志</button>
      </div>
    </nav>
    <div class="ad-side-foot">
      <div class="ad-avatar">O</div>
      <div><div class="ad-who">ops@lumio.games</div><div class="ad-role">白名单管理员</div></div>
    </div>
  </aside>

  <!-- 主区 -->
  <div class="ad-main">
    <header class="ad-topbar">
      <button type="button" class="adx-menu-btn" id="menu-btn" aria-label="打开导航">☰</button>
      <div><h1 id="topbar-title">总览</h1><div class="ad-crumb" id="topbar-crumb">Lumio Admin / 总览</div></div>
      <div class="ad-spacer"></div>
      <a class="ad-btn sm" href="../unified-shell/index.html">返回生图站</a>
    </header>
    <main class="ad-content" id="ad-content">
      <section class="ad-view active" id="view-overview" data-screen-label="屏B 总览"></section>
      <section class="ad-view" id="view-materials" data-screen-label="屏C 素材库"></section>
      <section class="ad-view" id="view-shares" data-screen-label="屏C 分享管理"></section>
      <section class="ad-view" id="view-safety" data-screen-label="屏C 内容安全"></section>
      <section class="ad-view" id="view-announcements" data-screen-label="屏C 公告运营"></section>
      <section class="ad-view" id="view-users" data-screen-label="屏D 用户记录"></section>
      <section class="ad-view" id="view-invites" data-screen-label="屏D 邀请裂变"></section>
      <section class="ad-view" id="view-errors" data-screen-label="屏E 报错监控"></section>
      <section class="ad-view" id="view-cost" data-screen-label="屏E 成本看板"></section>
      <section class="ad-view" id="view-audit" data-screen-label="屏E 审计日志"></section>
    </main>
  </div>
</div>

<!-- 抽屉 -->
<div class="ad-scrim" id="drawer-scrim"></div>
<aside class="ad-drawer" id="drawer" aria-label="详情抽屉">
  <div class="ad-drawer-head">
    <div style="flex:1; min-width:0"><h3 id="drawer-title">详情</h3><div class="ad-sub" id="drawer-sub"></div></div>
    <button type="button" class="ad-btn sm ghost" id="drawer-close" aria-label="关闭">✕</button>
  </div>
  <div class="ad-drawer-body" id="drawer-body"></div>
</aside>

<!-- ConfirmDialog -->
<div class="adx-dialog-scrim" id="dialog-scrim" data-screen-label="屏A ConfirmDialog">
  <div class="adx-dialog" role="alertdialog" aria-modal="true">
    <h3 id="dialog-title"></h3>
    <p class="desc" id="dialog-desc"></p>
    <div class="adx-impact" id="dialog-impact"></div>
    <div class="adx-dialog-actions">
      <button type="button" class="ad-btn" id="dialog-cancel">取消</button>
      <button type="button" class="ad-btn confirm-crit" id="dialog-ok">确认</button>
    </div>
  </div>
</div>

<!-- 403（演示切换） -->
<div class="ad-forbidden" id="forbidden" data-screen-label="屏A 403">
  <div class="box">
    <div class="lock">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
    </div>
    <h1>这个后台需要白名单权限</h1>
    <p>当前账号不在 ADMIN_EMAILS 白名单中。如果你是运营同学，请联系管理员把你的邮箱加入白名单后重新登录。</p>
    <div class="who">guest@example.com</div>
    <div><a class="ad-btn primary" href="../unified-shell/index.html">返回生图站</a> <button type="button" class="ad-btn" id="forbidden-close">重新登录</button></div>
  </div>
</div>

<div class="adx-toast-wrap" id="toast-wrap"></div>

<!-- 演示控制条 -->
<div style="position:fixed; left:16px; bottom:16px; z-index:95; display:flex; gap:6px; flex-wrap:wrap; border:1px dashed var(--ad-border-strong); border-radius:12px; padding:7px 9px; background:rgba(255,255,255,.9); backdrop-filter:blur(8px); font-family:var(--ad-sans); font-size:11px; color:var(--ad-faint); max-width:min(520px, calc(100vw - 32px))" data-screen-label="演示控制">
  <strong style="font-size:11px">状态演示</strong>
  <button type="button" class="ad-btn sm" data-demo="403">403</button>
  <button type="button" class="ad-btn sm" data-demo="loading">加载态</button>
  <button type="button" class="ad-btn sm" data-demo="error">错误态</button>
  <button type="button" class="ad-btn sm" data-demo="empty">空态</button>
  <button type="button" class="ad-btn sm" data-demo="celebrate">收束性空态</button>
  <button type="button" class="ad-btn sm" data-demo="badge-fail">徽标加载失败</button>
</div>

<script src="admin-data.js"></script>
<script src="admin-views.js"></script>
<script src="admin-app.js"></script>
</body>
</html>
