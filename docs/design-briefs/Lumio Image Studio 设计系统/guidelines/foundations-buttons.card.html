<!-- @dsCard group="Foundations" viewport="700x160" name="按钮与结果操作" subtitle="域身份色贯穿：生成 violet · 画布 teal · 分享 green · 主黑" -->
<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"></meta><link rel="stylesheet" href="../styles.css"></link></head>
<body style="margin:0; background:var(--studio-bg); font-family:Inter, 'PingFang SC', sans-serif; padding:16px 20px; display:flex; flex-direction:column; gap:12px">
<div style="display:flex; flex-wrap:wrap; gap:8px; align-items:center">
  <button type="button" class="btn generate">开始使用 →</button>
  <button type="button" class="btn teal">打开画布</button>
  <button type="button" class="btn primary">主操作</button>
  <button type="button" class="btn">次操作</button>
  <button type="button" class="btn danger">删除</button>
</div>
<div style="display:flex; flex-wrap:wrap; gap:8px; align-items:center">
  <button type="button" class="save-button">保存到作品集</button>
  <button type="button" class="open-canvas-button">在画布中打开</button>
  <button type="button" class="share-card-button">分享提示词卡片</button>
  <span class="action-divider"></span>
  <button type="button" class="icon-button" aria-label="下载">↓</button>
  <button type="button" class="icon-button" aria-label="重新生成">↻</button>
</div>
</body></html>
