<!-- @dsCard group="Admin 公共件" viewport="700x170" name="Pill · KPI · 语义色" subtitle="五 tone pill + KPI 卡 delta 涨跌语义" -->
<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"></meta><link rel="stylesheet" href="../styles.css"></link></head>
<body style="margin:0; background:var(--ad-ground); font-family:var(--ad-sans); padding:16px 20px">
<div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px">
  <span class="ad-pill good">已发放</span>
  <span class="ad-pill warn">待发放</span>
  <span class="ad-pill crit">作弊拦截</span>
  <span class="ad-pill neutral">已结束</span>
  <span class="ad-pill accent">material.update</span>
  <span class="ad-pill warn plain">2 次举报</span>
</div>
<div style="display:grid; grid-template-columns:repeat(3,1fr); gap:12px">
  <div class="ad-kpi"><div class="label">今日成功生成</div><div class="val ad-tnum">486</div><span class="ad-delta up">▲ 12.4%</span></div>
  <div class="ad-kpi"><div class="label">失败损耗</div><div class="val ad-tnum">$7.9</div><span class="ad-delta down">▼ 需关注</span></div>
  <div class="ad-kpi"><div class="label">今日活跃</div><div class="val ad-tnum">512</div><span class="ad-delta flat">— 持平</span></div>
</div>
</body></html>
