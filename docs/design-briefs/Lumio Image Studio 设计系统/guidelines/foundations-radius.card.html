<!-- @dsCard group="Foundations" viewport="700x170" name="圆角 · 阴影 · 点阵签名" subtitle="控件 12 / 卡片 16 / pill 999 · 阴影极轻 · 深色点阵网格" -->
<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"></meta><link rel="stylesheet" href="../styles.css"></link>
<style>
.row { display: flex; gap: 12px; padding: 16px; align-items: stretch; font-family: Inter, 'PingFang SC', sans-serif; }
.spec { flex: 1; background: var(--studio-surface); border: 1px solid var(--studio-line-strong); padding: 10px 12px; font-size: 11px; color: var(--studio-muted); display: flex; flex-direction: column; justify-content: flex-end; min-height: 110px; }
.spec b { color: var(--studio-text); font-size: 12px; }
</style></head>
<body style="margin:0; background:var(--studio-bg)">
<div class="row">
  <div class="spec" style="border-radius:var(--ui-radius-control)"><b>控件 12px</b>--ui-radius-control</div>
  <div class="spec" style="border-radius:var(--ui-radius-card); box-shadow:0 1px 1px rgba(0,0,0,.04)"><b>卡片 16px</b>阴影 0 1px 1px .04</div>
  <div class="spec" style="border-radius:999px; align-items:center; justify-content:center; text-align:center"><b>Pill 999px</b></div>
  <div class="spec" style="border-radius:24px; box-shadow:0 20px 60px -20px rgba(0,0,0,.25)"><b>图框 24px</b>深投影 60px</div>
  <div class="spec" data-theme="dark" style="border-radius:16px; background-color:#090a0f; background-image:radial-gradient(rgba(245,245,244,.14) 1px, transparent 1px); background-size:16px 16px; color:#a6aab5; border-color:rgba(255,255,255,.16)"><b style="color:#eeeff3">点阵网格</b>深色签名 16×16</div>
</div>
</body></html>
