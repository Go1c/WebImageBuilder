<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"></meta><link rel="stylesheet" href="../styles.css"></link>
<style>
.sw-row { display: flex; gap: 10px; padding: 16px; }
.sw { flex: 1; border-radius: 12px; padding: 10px 12px; color: #fff; min-height: 96px; display: flex; flex-direction: column; justify-content: flex-end; }
.sw b { font-size: 12px; font-weight: 600; }
.sw code { font-size: 10px; opacity: .85; font-family: ui-monospace, Menlo, monospace; }
</style></head>
<body style="margin:0">
<div class="sw-row">
  <div class="sw" style="background:var(--lumio-violet)"><b>生成域 violet</b><code>--lumio-violet #8b78f5</code></div>
  <div class="sw" style="background:var(--lumio-teal); color:#052420"><b>画布域 teal</b><code>--lumio-teal #2cd4be</code></div>
  <div class="sw" style="background:var(--lumio-orange); color:#3b2a00"><b>标注 orange</b><code>--lumio-orange #f3a63a</code></div>
  <div class="sw" style="background:#7f22fe"><b>生成 CTA</b><code>--studio-purple #7f22fe</code></div>
  <div class="sw" style="background:#00bc7d"><b>金额/成功</b><code>--studio-green #00bc7d</code></div>
  <div class="sw" style="background:var(--lumio-danger)"><b>危险</b><code>--lumio-danger #f0705e</code></div>
</div>
</body></html>
